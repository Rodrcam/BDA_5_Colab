{% extends "base.html" %}
{% block title %}Profesores{% endblock %}

{% block content %}
<h1>Profesores</h1>
<a href="{{ url_for('profesores.nuevo') }}" class="btn btn-primary">+ Nuevo profesor</a>

<table class="data-table">
  <thead>
    <tr><th>ID</th><th>Nombre</th></tr>
  </thead>
  <tbody>
    {% for p in profesores %}
    <tr>
      <td class="uuid">{{ p[0] }}</td>
      <td>{{ p[1] }}</td>
    </tr>
    {% else %}
    <tr><td colspan="2" class="empty">No hay profesores.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
