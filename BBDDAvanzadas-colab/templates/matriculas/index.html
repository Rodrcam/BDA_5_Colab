{% extends "base.html" %}
{% block title %}Matrículas{% endblock %}

{% block content %}
<h1>Matrículas</h1>
<a href="{{ url_for('matriculas.nueva') }}" class="btn btn-primary">+ Nueva matrícula</a>

<form class="search-form" method="get" action="{{ url_for('matriculas.buscar') }}">
  <label>Filtro JSONB extras (@&gt;):</label>
  <input type="text" name="extras" value="{{ json_filter|default('{}') }}" placeholder='{"beca": true}' style="width:200px" />
  <button type="submit" class="btn">Filtrar</button>
  <a href="{{ url_for('matriculas.index') }}" class="btn btn-secondary">Limpiar</a>
</form>

{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<table class="data-table">
  <thead>
    <tr><th>Alumno</th><th>Curso</th><th>Fecha</th></tr>
  </thead>
  <tbody>
    {% for m in matriculas %}
    <tr>
      <td>{{ m[0] }}</td>
      <td>{{ m[1] }}</td>
      <td>{{ m[2] }}</td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="empty">No hay matrículas.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
